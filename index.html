        body {

            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            box-sizing: border-box;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .suggestions {
            position: absolute;
            width: 100%;
            background: white;
            border: 1px solid #dcdde1;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .suggestions div {
            padding: 10px 20px;
            cursor: pointer;
        }
        .suggestions div:hover {
            background-color: #f1f2f6;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .result-section {
            margin-top: 25px;
            display: none;
        }
        h3 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
            margin-top: 20px;
        }
        ol {
            padding-left: 20px;
            line-height: 1.6;
        }
        li {
            margin-bottom: 8px;
        }
        .highlight {
            font-weight: bold;
            color: #e67e22;
        }
        .base-element {
            color: #27ae60;
            font-style: italic;
        }
        .error-msg {
            color: #c0392b;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

// Базовые элементы, которые не крафтятся
const baseElements = new Set(["земля", "пламя", "вода", "воздух"]);

const inputEl = document.getElementById('elementInput');
const sugEl = document.getElementById('suggestions');

// Всплывающие подсказки при вводе
inputEl.addEventListener('input', () => {
    const val = inputEl.value.toLowerCase().trim();
    sugEl.innerHTML = '';
    if (!val) return;

    const filtered = Object.keys(recipes).filter(k => k.includes(val));
    baseElements.forEach(b => { if(b.includes(val)) filtered.push(b); });

    [...new Set(filtered)].slice(0, 7).forEach(item => {
        const div = document.createElement('div');
        div.textContent = item.charAt(0).toUpperCase() + item.slice(1);
        div.addEventListener('click', () => {
            inputEl.value = div.textContent;
            sugEl.innerHTML = '';
        });
        sugEl.appendChild(div);
    });
});

document.addEventListener('click', (e) => {
    if (e.target !== inputEl) sugEl.innerHTML = '';
});

// Рекурсивный алгоритм построения дерева шагов
function buildSteps(element, stepsList, visited = new Set()) {
    const normalized = element.toLowerCase().trim();
    
    if (baseElements.has(normalized)) return;
    if (visited.has(normalized)) return;
    
    const recipe = recipes[normalized];
    if (!recipe) return;

    // Рекурсивно разбираем первый и второй компоненты крафта
    buildSteps(recipe[0], stepsList, visited);
    buildSteps(recipe[1], stepsList, visited);

    if (!visited.has(normalized)) {
        visited.add(normalized);
        
        const parent1 = baseElements.has(recipe[0].toLowerCase()) ? `<span class="base-element">${recipe[0]}</span>` : `<span class="highlight">${recipe[0]}</span>`;
        const parent2 = baseElements.has(recipe[1].toLowerCase()) ? `<span class="base-element">${recipe[1]}</span>` : `<span class="highlight">${recipe[1]}</span>`;
        const target = element.charAt(0).toUpperCase() + element.slice(1);

        stepsList.push(`${parent1} + ${parent2} = <strong>${target}</strong>`);
    }
}

function findRecipe() {
    const inputVal = inputEl.value.trim();
    const normalized = inputVal.toLowerCase();
    
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');
    const directPairP = document.getElementById('directPair');
    const treeStepsOl = document.getElementById('treeSteps');

    errorDiv.textContent = '';
    resultDiv.style.display = 'none';
    treeStepsOl.innerHTML = '';

    if (!inputVal) {
        errorDiv.textContent = 'Пожалуйста, введите название элемента.';
        return;
    }

    if (baseElements.has(normalized)) {
        errorDiv.innerHTML = `Элемент <span class="base-element">${inputVal}</span> является базовым. Его не нужно крафтить!`;
        return;
    }

    if (!recipes[normalized]) {
        errorDiv.textContent = 'Элемент не найден';
        return;
    }

    resultDiv.style.display = 'block';

    // 1. Отображение финальной пары
    const directComponents = recipes[normalized];
    const d1 = baseElements.has(directComponents[0].toLowerCase()) ? `<span class="base-element">${directComponents[0]}</span>` : `<span class="highlight">${directComponents[0]}</span>`;
    const d2 = baseElements.has(directComponents[1].toLowerCase()) ? `<span class="base-element">${directComponents[1]}</span>` : `<span class="highlight">${directComponents[1]}</span>`;
    directPairP.innerHTML = `${d1} + ${d2}`;

    // 2. Генерация всей цепочки сборки с нуля
    let steps = [];
    buildSteps(normalized, steps);

    steps.forEach(stepText => {
        const li = document.createElement('li');
        li.innerHTML = stepText;
        treeStepsOl.appendChild(li);
    });
}
</script>
